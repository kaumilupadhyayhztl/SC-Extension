<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SC Tool</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <span class="logo">⚡ SC Tool</span>
  <button id="picker-btn" class="picker-btn off">🔴 Picker: OFF</button>
</header>

<!-- ── STATUS BAR ── -->
<div id="status-bar" class="status-bar" style="display:none;"></div>

<!-- ── BACKEND CONFIG ── -->
<div class="section">
  <div class="section-hdr" id="hdr-config">
    <span>⚙️ Backend Config</span><span id="config-arrow">▼</span>
  </div>
  <div id="config-body" class="section-body">
    <div class="form-row">
      <label>Vercel API URL</label>
      <input id="api-url" type="text" placeholder="https://your-backend.vercel.app" />
    </div>
    <button id="save-config-btn" class="btn-sm btn-primary">💾 Save</button>
  </div>
</div>

<!-- ── IMPORT (Fix 2: Export moved to Page Structure) ── -->
<div class="action-bar">
  <label class="btn-sm btn-purple" style="cursor:pointer;">
    📥 Import Excel
    <input type="file" id="excel-input" accept=".xlsx,.xls" style="display:none;" />
  </label>
</div>

<!-- ── TEMPLATES ── -->
<div class="section">
  <div class="section-hdr" id="hdr-templates">
    <span>● Templates <span id="tpl-count" class="badge" style="display:none;"></span></span>
    <span id="templates-arrow">▼</span>
  </div>
  <div id="templates-body" class="section-body">
    <input type="text" id="tpl-search" placeholder="🔍 Search templates..." />
    <div id="tpl-list" class="tpl-list">
      <div class="empty-msg">📥 Import Excel to load templates</div>
    </div>
  </div>
</div>

<!-- ── PAGE STRUCTURE (Fix 2: Export button lives here now) ── -->
<div class="section">
  <div class="section-hdr" id="hdr-structure">
    <span>▲ Page Structure <span id="struct-count" class="badge" style="display:none;"></span></span>
    <span id="structure-arrow">▼</span>
  </div>
  <div id="structure-body" class="section-body">
    <div id="struct-tree" class="struct-tree">
      <div class="empty-msg">Select a template above and add items here.</div>
    </div>
    <!-- Fix 2: Export moved here -->
    <button id="export-btn" class="btn-green full-btn" style="margin-top:10px;">📤 Export All to Excel</button>
  </div>
</div>

<!-- ── ITEM DETAILS ── -->
<div class="section" id="item-section" style="display:none;">
  <div class="section-hdr" id="hdr-item">
    <span>● Item — <span id="item-tpl-lbl" style="color:#E8A020;"></span></span>
    <span id="item-arrow">▼</span>
  </div>
  <div id="item-body" class="section-body">

    <!-- Name -->
    <div class="form-row">
      <label>Item Name *</label>
      <div class="input-row">
        <input id="item-name" type="text" placeholder="e.g. Home, Banner-1..." />
        <button id="name-map-btn" class="map-btn" title="Pick name from page">📌</button>
      </div>
      <div id="name-map-hint" class="hint orange" style="display:none;">⚡ Click any element on the page</div>
    </div>

    <!-- Is Page -->
    <div class="form-row">
      <label>Is Page?</label>
      <div class="toggle-row">
        <button class="tog yes-on" id="tog-yes">✅ Yes — Page</button>
        <button class="tog"        id="tog-no">🗂 No — Datasource</button>
      </div>
      <div id="ispage-hint" class="hint blue">📄 Creates a page in Sitecore</div>
    </div>

    <!-- Fix 1: Parent page — now shows for Datasource (No), hidden for Page (Yes) -->
    <div class="form-row" id="parent-row" style="display:none;">
      <label>Parent Page</label>
      <select id="parent-sel"></select>
    </div>

    <!-- Fields -->
    <div id="fields-wrap">
      <div class="fields-hdr">
        <span>Fields — <span id="field-count">0 / 0</span></span>
        <span id="field-pct" style="color:#E8A020;font-weight:700;">0%</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      <div id="fields-list" style="margin-top:6px;"></div>
      <button id="save-fields-btn" class="btn-primary full-btn" style="margin-top:8px;">💾 Save Fields</button>
    </div>

    <button id="add-structure-btn" class="btn-dark full-btn" style="margin-top:8px;">+ Add to Structure</button>
  </div>
</div>

<!-- ── SELECTED ELEMENT PANEL ── -->
<div id="selected-panel" class="selected-panel" style="display:none;">
  <div class="selected-hdr">🟠 Selected from page</div>
  <div id="selected-tag" class="selected-tag"></div>
  <!-- Fix 4: textarea so user can edit the captured text before mapping -->
  <textarea id="selected-info" class="selected-info" rows="2" placeholder="Captured content..."></textarea>
  <div class="map-row">
    <select id="map-field-sel">
      <option value="">— map to field —</option>
    </select>
    <button id="map-field-btn"      class="btn-orange btn-sm">Map ✓</button>
    <button id="close-selected-btn" class="btn-sm" style="background:#eee;">✕</button>
  </div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
